<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Australian Boat Race live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#E9EFF1; --panel:#FFFFFF; --ink:#12303E; --muted:#587482; --line:#C6D4DA; --water:#D2E1E7; --warn:#A8501A;
  --num:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0D1D25; --panel:#142A34; --ink:#E3EDF1; --muted:#8EA8B4; --line:#284450; --water:#1A3541; --warn:#E08A4F; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{padding:max(10px,1vw) max(12px,1.5vw) 16px}
header.top{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"icoL icoR" "ttl ttl" "rl rr";gap:10px 12px;align-items:center}
#icoL{grid-area:icoL;justify-self:start} #icoR{grid-area:icoR;justify-self:end}
#racesL{grid-area:rl} #racesR{grid-area:rr}
.corner{width:96px;height:96px;object-fit:contain}
.ttl{grid-area:ttl;text-align:center;min-width:0}
header h1{font-family:var(--num);font-weight:700;font-size:clamp(26px,5vw,44px);line-height:1;margin:0}
#sub{margin:2px 0 0;color:var(--muted)}
.ttl h2{font-family:var(--num);font-weight:600;font-size:clamp(20px,3.5vw,28px);margin:8px 0 0}
.gap{font-family:var(--num);font-weight:700;font-size:clamp(26px,5vw,40px);line-height:1.1;margin:2px 0 0}
.gapsub{color:var(--muted);margin:0;min-height:1.45em}
.races{display:flex;flex-direction:column;gap:6px;align-self:center}
.races button{display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
.races button b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.races button .rs{display:block;font-size:13px;color:var(--muted)}
.races button .rs.racing{color:#C8452F;font-weight:700}
.races button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.races button[aria-selected="true"] .rs{color:var(--bg);opacity:.85}
.races button[aria-selected="true"] .rs.racing{color:#FF8A73;opacity:1}
.races button:focus-visible{outline:3px solid #4A9BC4;outline-offset:2px}
.strip{background:var(--water);border-radius:10px;overflow:hidden;margin-top:10px}
.strip svg{display:block;width:100%;height:auto}
.board{display:grid;gap:10px;margin-top:10px;grid-template-columns:1fr 1fr;grid-template-areas:"st0 st1" "map map" "ls0 ls1"}
#st0{grid-area:st0} #st1{grid-area:st1} #ls0{grid-area:ls0} #ls1{grid-area:ls1}
#map{grid-area:map;min-height:460px;border-radius:10px;border:1px solid var(--line);z-index:0}
.card{background:var(--panel);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:10px;padding:10px}
.card.stale{opacity:.55}
.chead{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:8px}
.emb{width:44px;height:44px;flex:none;object-fit:contain}
.emb.ph{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px var(--num);letter-spacing:.02em}
.emb.wide{width:100%;height:56px;object-position:left center}
.chead .nm{font-family:var(--num);font-weight:600;font-size:19px;line-height:1.1}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.stat b{font-family:var(--num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--warn);min-height:1.4em;margin-top:4px}
.card h3{font-family:var(--num);font-weight:600;font-size:20px;margin:0 0 6px}
.card table{width:100%;border-collapse:collapse}
.card td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.card td:first-child{font-weight:600;white-space:nowrap;width:1%;color:var(--muted);padding-right:10px}
.card td .deg{display:block;font-size:13px;color:var(--muted)}
footer{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-top:14px}
.brlogo{width:32px;height:32px;border-radius:7px;object-fit:contain;flex:none}
@media (min-width:1200px){
  html,body{font-size:1vw}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:.8vw 1.2vw .5vw}
  header.top{flex:none;grid-template-columns:auto 16vw 1fr 16vw auto;grid-template-areas:"icoL rl ttl rr icoR";gap:1.2vw}
  .corner{width:14vw;height:14vw}
  header h1{font-size:2.6vw}
  .ttl h2{font-size:1.7vw;margin-top:.4vw}
  .gap{font-size:3vw}
  .races{gap:.6vw}
  .races button{padding:.6vw .9vw;border-radius:.6vw}
  .races button b{font-size:1.25vw}
  .races button .rs{font-size:1vw}
  .strip{flex:none;margin-top:.6vw;border-radius:.6vw}
  .board{flex:1;min-height:0;margin-top:.6vw;gap:.8vw;grid-template-columns:1fr 1fr 1.6fr 1fr 1fr;grid-template-areas:"ls0 st0 map st1 ls1";grid-template-rows:minmax(0,1fr)}
  #map{min-height:0;height:100%;border-radius:.6vw}
  .card{padding:.9vw;overflow:auto;min-height:0;border-radius:.6vw;border-top-width:.45vw}
  .emb.wide{height:5vw}
  .emb.ph{width:3.5vw;height:3.5vw;font-size:1.3vw}
  .chead .nm{font-size:1.6vw}
  .stat{padding:.5vw 0;gap:.1vw}
  .stat b{font-size:4vw}
  .stat span{font-size:1vw}
  .note{font-size:.9vw}
  .card h3{font-size:1.3vw;margin-bottom:.3vw}
  .card td{font-size:.95vw;padding:.3vw 0;line-height:1.25}
  .card td:first-child{padding-right:.6vw}
  .card td .deg{font-size:.85vw}
  footer{flex:none;margin-top:.4vw;font-size:.8vw;gap:.5vw}
  .brlogo{width:1.4vw;height:1.4vw;border-radius:.3vw}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="corner" id="icoL" alt="">
    <nav class="races" id="racesL"></nav>
    <section class="ttl" aria-live="polite">
      <h1 id="title"></h1><p id="sub"></p>
      <h2 id="raceName"></h2>
      <div class="gap" id="gap"></div>
      <p class="gapsub" id="gapsub"></p>
    </section>
    <nav class="races" id="racesR"></nav>
    <img class="corner" id="icoR" alt="">
  </header>
  <div class="strip" aria-hidden="true"><svg id="close" viewBox="0 0 1000 150" style="color:inherit"></svg></div>
  <div class="board">
    <div class="card" id="ls0"></div>
    <div class="card" id="st0"></div>
    <div id="map"></div>
    <div class="card" id="st1"></div>
    <div class="card" id="ls1"></div>
  </div>
  <footer id="foot"><img class="brlogo" id="brlogo" alt="BoatRun"><span>Numbers are smoothed and run a few seconds behind the water. Live tracking by BoatRun.</span></footer>
</div>

<script>
/* ═══════════════ EDIT THIS SECTION ═══════════════ */
const WORKER = 'https://boatrun-race.davidmacready74.workers.dev';
const EVENT_TITLE = 'The Australian Boat Race';
const EVENT_SUB = 'Live from the water';
const BOATRUN_LOGO = 'icons/icon-192.png';
const ICON_LEFT = 'emblems/sydney.png';
const ICON_RIGHT = 'emblems/melbourne.svg';
// Crew emblem: put image files on the site and set logo: 'emblems/sydney.png'. Leave '' to show initials.

// Course centreline, start to finish, [lat, lon]. Add a point at every bend.
const COURSE_LONG = [
  [-33.83898308138718, 151.17587655902042], [-33.84665395961514, 151.18704933162556], [-33.84944654816737, 151.19057664965], [-33.85395603768015, 151.19418916278542],[-33.85659419304149, 151.19655669992156],[-33.86855917965614, 151.20050657005478],[-33.87220256900091, 151.20089284327517]
];
const COURSE_SHORT = [
  [-33.85659419304149, 151.19655669992156],[-33.86855917965614, 151.20050657005478],[-33.87220256900091, 151.20089284327517]
];

// phone = the rower name typed into BoatRun Metrics on that boat's phone.
// side = which side of the page the race button goes. start = start time shown before the race, e.g. '10:30'.
// crew = [seat, name, degree]
const RACES = [
  { name: "Men's eights", code: 'ABRMEN8', side: 'left', start: '', course: COURSE_LONG, boatLen: 17.5,
    crews: [
      { phone: 'SYD M8', short: 'Sydney', name: 'University of Sydney', logo: 'emblems/sydney.svg', colour: '#E3A92B',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] },
      { phone: 'MEL M8', short: 'Melbourne', name: 'University of Melbourne', logo: 'emblems/melbourne.png', colour: '#1C4E8C',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] }
    ] },
  { name: "Women's eights", code: 'ABRWOM8', side: 'left', start: '', course: COURSE_LONG, boatLen: 17.5,
    crews: [
      { phone: 'SYD W8', short: 'Sydney', name: 'University of Sydney', logo: 'emblems/sydney.svg', colour: '#E3A92B',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] },
      { phone: 'MEL W8', short: 'Melbourne', name: 'University of Melbourne', logo: 'emblems/melbourne.png', colour: '#1C4E8C',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] }
    ] },
  { name: "College Men", code: 'ABRCOLM', side: 'right', start: '', course: COURSE_SHORT, boatLen: 17.5,
    crews: [
      { phone: 'SYD R3', short: 'WW', name: 'WW College', logo: '', colour: '#E3A92B',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] },
      { phone: 'MEL R3', short: 'XX', name: 'XX College', logo: '', colour: '#1C4E8C',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] }
    ] },
  { name: "College Women", code: 'ABRCOLW', side: 'right', start: '', course: COURSE_SHORT, boatLen: 17.5,
    crews: [
      { phone: 'SYD R4', short: 'YY', name: 'YY College', logo: '', colour: '#E3A92B',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] },
      { phone: 'MEL R4', short: 'ZZ', name: 'ZZ College', logo: '', colour: '#1C4E8C',
        crew: [['Bow','',''],['2','',''],['3','',''],['4','',''],['5','',''],['6','',''],['7','',''],['Stroke','',''],['Cox','',''],['Coach','','']] }
    ] }
];
/* ═══════════════ END OF EDIT SECTION ═══════════════ */

const DEMO = new URLSearchParams(location.search).has('demo');
const S = { race: 0, trk: {}, lastOk: 0, map: null, line: null, marks: [], polling: false, t0: Date.now() };

/* ── course geometry ── */
function mkCourse(pts){
  const o = pts[0], kx = 111320 * Math.cos(o[0] * Math.PI / 180), ky = 110540;
  const xy = pts.map(p => [(p[1] - o[1]) * kx, (p[0] - o[0]) * ky]);
  const cum = [0];
  for (let i = 1; i < xy.length; i++) cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  return { pts, o, kx, ky, xy, cum, len: cum[cum.length - 1] };
}
function project(c, lat, lon, prevD){
  const x = (lon - c.o[1]) * c.kx, y = (lat - c.o[0]) * c.ky, n = c.xy.length - 1;
  const run = win => {
    let best = null;
    for (let i = 0; i < n; i++){
      if (win && (c.cum[i + 1] < prevD - 250 || c.cum[i] > prevD + 500)) continue;
      const [ax, ay] = c.xy[i], [bx, by] = c.xy[i + 1];
      const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
      let t = ((x - ax) * dx + (y - ay) * dy) / (L * L);
      const tMin = i === 0 ? -300 / L : 0, tMax = i === n - 1 ? 1 + 300 / L : 1;
      t = Math.max(tMin, Math.min(tMax, t));
      const px = ax + t * dx, py = ay + t * dy, e = Math.hypot(x - px, y - py);
      if (!best || e < best.e) best = { e, d: c.cum[i] + t * L, off: (dx * (y - ay) - dy * (x - ax)) / L };
    }
    return best;
  };
  return (prevD != null && run(true)) || run(false);
}
function pointAt(c, d, off){
  let i = 0;
  while (i < c.cum.length - 2 && c.cum[i + 1] < d) i++;
  const L = (c.cum[i + 1] - c.cum[i]) || 1, t = (d - c.cum[i]) / L;
  const [ax, ay] = c.xy[i], [bx, by] = c.xy[i + 1], ux = (bx - ax) / L, uy = (by - ay) / L;
  const x = ax + (bx - ax) * t - uy * off, y = ay + (by - ay) * t + ux * off;
  return [c.o[0] + y / c.ky, c.o[1] + x / c.kx];
}
RACES.forEach(r => { r._c = mkCourse(r.course); });

/* ── smoothing / tracking ── */
function trk(ri, ci){
  const k = ri + '_' + ci;
  if (!S.trk[k]) S.trk[k] = { D: null, V: 0, tRef: 0, off: 0, rate: 0, pace: 0, lastT: 0, seen: 0, disp: null, fin: null, live: false };
  return S.trk[k];
}
function feed(tr, b, c, serverNow){
  if (!b || b.t === tr.lastT) return;
  tr.lastT = b.t;
  const tL = Date.now() - Math.min(60000, Math.max(0, serverNow - b.t));
  tr.seen = tL; tr.live = !!b.lv;
  if (b.r > 0) tr.rate = tr.rate ? tr.rate + 0.3 * (b.r - tr.rate) : b.r;
  if (b.p > 60 && b.p < 600) tr.pace = tr.pace ? tr.pace + 0.3 * (b.p - tr.pace) : b.p;
  const v = (b.lv && b.p > 60 && b.p < 600) ? 500 / b.p : 0;
  tr.V = b.lv ? tr.V + 0.35 * (v - tr.V) : 0;
  if (b.la == null || b.lo == null) return;
  const pr = project(c, b.la, b.lo, tr.D);
  if (!pr) return;
  if (tr.D == null) tr.D = pr.d;
  else {
    const pred = tr.D + tr.V * Math.max(0, tL - tr.tRef) / 1000, e = pr.d - pred;
    tr.D = Math.abs(e) > 150 ? pr.d : pred + 0.35 * e;
  }
  tr.tRef = tL;
  tr.off += 0.3 * (pr.off - tr.off);
}
function dispD(tr, c, now){
  if (tr.D == null) return null;
  let d = tr.D + tr.V * Math.min(6000, Math.max(0, now - tr.tRef)) / 1000;
  if (tr.disp != null && d < tr.disp && d > tr.disp - 30) d = tr.disp;
  tr.disp = d;
  if (tr.fin == null && d >= c.len && tr.V > 0.5) tr.fin = tr.tRef + (c.len - tr.D) / tr.V * 1000;
  if (tr.fin != null && d < c.len * 0.5) tr.fin = null;
  return d;
}

/* ── data ── */
const norm = s => String(s || '').trim().toUpperCase();
function assign(race, boats){
  const ids = Object.keys(boats).sort(), used = new Set(), map = {};
  race.crews.forEach((cr, ci) => { const id = ids.find(i => !used.has(i) && norm(boats[i].n) === norm(cr.phone)); if (id){ map[ci] = id; used.add(id); } });
  race.crews.forEach((cr, ci) => { if (map[ci]) return; const id = ids.find(i => !used.has(i)); if (id){ map[ci] = id; used.add(id); } });
  return map;
}
function demoData(ri){
  const race = RACES[ri], c = race._c, s = (Date.now() - S.t0) / 1000, boats = {};
  race.crews.forEach((cr, ci) => {
    const base = ci ? 5.22 : 5.28, surge = 0.12 * Math.sin(s / (14 + ci * 3));
    let d = -40 + base * s + 6 * Math.sin(s / 25 + ci), v = base + surge;
    if (d > c.len + 60){ d = c.len + 60; v = 0; }
    const p = pointAt(c, Math.max(-60, d), (ci ? -7 : 7) + (Math.random() - .5) * 3);
    boats['demo' + ci] = { n: cr.phone, r: Math.round(36 - Math.min(4, s / 60) + Math.sin(s / 9)), p: v > 0 ? Math.round(500 / v) : 0,
      la: p[0] + (Math.random() - .5) * 2e-5, lo: p[1] + (Math.random() - .5) * 2e-5, lv: v > 0 ? 1 : 0, t: Date.now() - 1500 };
  });
  return { now: Date.now(), boats };
}
async function getData(ri){
  if (DEMO) return demoData(ri);
  const r = await fetch(WORKER + '/race/' + RACES[ri].code, { cache: 'no-store' });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function pollOne(ri){
  try {
    const j = await getData(ri);
    const race = RACES[ri], boats = j.boats || {}, map = assign(race, boats);
    race.crews.forEach((cr, ci) => { if (map[ci]) feed(trk(ri, ci), boats[map[ci]], race._c, j.now || Date.now()); });
    S.lastOk = Date.now();
  } catch (e) {}
}
function poll(){ RACES.forEach((r, ri) => pollOne(ri)); }
async function pickStartRace(){
  if (DEMO) return;
  for (let i = 0; i < RACES.length; i++){
    try {
      const j = await getData(i);
      if (Object.values(j.boats || {}).some(b => b.lv)) { selectRace(i); return; }
    } catch (e) {}
  }
}

/* ── formatting ── */
const fmtPace = s => { if (!(s > 0)) return '–:––'; s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtM = m => Math.round(m).toLocaleString('en-AU');
const esc = s => String(s || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function lengthsTxt(m, bl){
  const l = m / bl;
  if (l < 0.2) return 'overlapping';
  if (l < 0.9) return 'about ' + (l < 0.4 ? 'a quarter' : l < 0.65 ? 'half' : 'three quarters') + ' of a length';
  return (l < 1.5 ? 'about 1 length' : 'about ' + Math.round(l) + ' lengths');
}

/* ── drawing ── */
function hull(x1, x2, y, col, label){
  const h = 9, w = x2 - x1, tip = Math.min(18, w * 0.25);
  return `<path d="M${x1},${y} Q${x1 + tip},${y - h} ${x1 + tip * 2},${y - h} L${x2 - tip * 2},${y - h} Q${x2 - tip},${y - h} ${x2},${y} Q${x2 - tip},${y + h} ${x2 - tip * 2},${y + h} L${x1 + tip * 2},${y + h} Q${x1 + tip},${y + h} ${x1},${y} Z" fill="${col}"/>`
    + `<text x="${x1 - 8}" y="${y + 6}" text-anchor="end" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600" font-size="26" fill="currentColor">${esc(label)}</text>`;
}
const vw = el => el.clientWidth && el.clientWidth < 600 ? 520 : Math.max(1000, Math.round(el.clientWidth * 1.4));
function drawClose(race, rows){
  const svg = document.getElementById('close'), c = race._c, have = rows.filter(r => r.d != null), VW = vw(svg);
  svg.setAttribute('viewBox', '0 0 ' + VW + ' 150');
  svg.style.color = getComputedStyle(document.body).color;
  if (!have.length){ svg.innerHTML = `<text x="${VW / 2}" y="82" text-anchor="middle" font-size="20" fill="currentColor" opacity=".6">Waiting for crews</text>`; return; }
  const ds = have.map(r => Math.min(r.d, c.len + 40)), hi = Math.max(...ds), lo = Math.min(...ds);
  const W = Math.min(400, Math.max(70, hi - lo + race.boatLen * 2.5)), left = hi + race.boatLen * 0.8 - W;
  const X = d => 110 + (d - left) / W * (VW - 130);
  let s = '';
  const step = W > 200 ? 50 : W > 100 ? 20 : 10;
  for (let m = Math.ceil(left / step) * step; m <= left + W; m += step){
    const x = X(m); if (x < 110) continue;
    const togo = c.len - m;
    s += `<line x1="${x}" y1="22" x2="${x}" y2="138" stroke="currentColor" stroke-opacity=".14"/>`;
    if (togo >= 0) s += `<text x="${x}" y="17" text-anchor="middle" font-size="17" fill="currentColor" opacity=".65">${fmtM(togo)}</text>`;
  }
  if (c.len > left && c.len < left + W) s += `<line x1="${X(c.len)}" y1="18" x2="${X(c.len)}" y2="142" stroke="#C8452F" stroke-width="3"/>`;
  rows.forEach((r, i) => {
    const y = 55 + i * 55;
    s += `<line x1="110" y1="${y}" x2="${VW - 20}" y2="${y}" stroke="currentColor" stroke-opacity=".08" stroke-dasharray="4 6"/>`;
    if (r.d == null) return;
    const d = Math.min(r.d, c.len + 40);
    s += hull(X(d - race.boatLen), X(d), y, r.cr.colour, r.cr.short);
  });
  svg.innerHTML = s;
}
const initials = s => String(s || '').split(/\s+/).map(w => w[0] || '').join('').slice(0, 3).toUpperCase();
function buildCrews(){
  const race = RACES[S.race];
  race.crews.slice(0, 2).forEach((cr, ci) => {
    const st = document.getElementById('st' + ci), ls = document.getElementById('ls' + ci);
    st.style.setProperty('--c', cr.colour); ls.style.setProperty('--c', cr.colour);
    const em = cr.logo ? `<img class="emb wide" src="${esc(cr.logo)}" alt="${esc(cr.name)}" onerror="this.outerHTML='<div class=&quot;nm&quot;>'+this.alt+'</div>'">` : `<div class="emb ph" style="background:${cr.colour}">${esc(initials(cr.short))}</div><div class="nm">${esc(cr.name)}</div>`;
    st.innerHTML = `<div class="chead">${em}</div>
      <div class="stat"><b id="tg${ci}">–</b><span>metres to go</span></div>
      <div class="stat"><b id="pc${ci}">–:––</b><span>per 500 m</span></div>
      <div class="stat"><b id="rt${ci}">–</b><span>strokes per min</span></div>
      <div class="note" id="nt${ci}"></div>`;
    ls.innerHTML = `<h3>Crew</h3><table>${cr.crew.map(p =>
      `<tr><td>${esc(p[0])}</td><td>${esc(p[1]) || '–'}${p[2] ? `<span class="deg">${esc(p[2])}</span>` : ''}</td></tr>`).join('')}</table>`;
  });
}
function initMap(){
  if (typeof L === 'undefined') { document.getElementById('map').style.display = 'none'; return; }
  S.map = L.map('map', { zoomControl: true, attributionControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(S.map);
}
function mapRace(){
  if (!S.map) return;
  const race = RACES[S.race];
  if (S.line) S.line.remove();
  S.marks.forEach(m => m.remove());
  S.line = L.polyline(race.course, { color: '#4A9BC4', weight: 5, opacity: .8 }).addTo(S.map);
  S.marks = race.crews.map(cr => L.circleMarker(race.course[0], { radius: 9, color: '#fff', weight: 2, fillColor: cr.colour, fillOpacity: 1, opacity: 0 }).addTo(S.map).bindTooltip(cr.short));
  S.map.fitBounds(S.line.getBounds(), { padding: [20, 20] });
}
function selectRace(i){
  S.race = i;
  document.querySelectorAll('.races button').forEach(b => b.setAttribute('aria-selected', +b.dataset.i === i ? 'true' : 'false'));
  buildCrews(); mapRace(); poll(); render();
  if (S.map) setTimeout(() => { S.map.invalidateSize(); if (S.line) S.map.fitBounds(S.line.getBounds(), { padding: [20, 20] }); }, 50);
}
function raceRows(ri, now){
  const race = RACES[ri];
  return race.crews.map((cr, ci) => {
    const tr = trk(ri, ci), d = dispD(tr, race._c, now);
    return { cr, ci, tr, d, stale: !tr.seen || now - tr.seen > 20000 };
  });
}
function raceStatus(ri, rows, now){
  const race = RACES[ri];
  if (rows.length && rows.every(r => r.tr.fin != null)){
    const w = rows.reduce((a, b) => a.tr.fin <= b.tr.fin ? a : b);
    return { txt: 'Result: ' + w.cr.short + ' won', cls: '' };
  }
  if (rows.some(r => !r.stale && r.tr.live) && rows.some(r => r.d != null && r.d > 20)) return { txt: 'Racing', cls: 'racing' };
  if (rows.some(r => !r.stale)) return { txt: 'On the water', cls: '' };
  return { txt: race.start ? 'Start ' + race.start : 'Waiting for crews', cls: '' };
}
function render(){
  const race = RACES[S.race], c = race._c, now = Date.now();
  let rows = null;
  RACES.forEach((r, ri) => {
    const rr = raceRows(ri, now), stt = raceStatus(ri, rr, now);
    if (ri === S.race) rows = rr;
    const el = document.getElementById('rs' + ri);
    if (el){ el.textContent = stt.txt; el.classList.toggle('racing', stt.cls === 'racing'); }
  });
  document.getElementById('raceName').textContent = race.name + ', ' + fmtM(c.len) + ' m';
  document.getElementById('sub').textContent = (!DEMO && S.lastOk && now - S.lastOk > 15000) ? 'Reconnecting' : (DEMO ? 'Demo, simulated crews' : EVENT_SUB);

  rows.forEach(r => {
    const tg = document.getElementById('tg' + r.ci);
    if (!tg) return;
    const togo = r.d == null ? null : Math.max(0, c.len - Math.max(0, r.d));
    const moving = r.tr.live && !r.stale;
    tg.textContent = r.tr.fin != null ? 'Finished' : (togo == null ? '–' : fmtM(togo));
    document.getElementById('pc' + r.ci).textContent = moving ? fmtPace(r.tr.pace) : '–:––';
    document.getElementById('rt' + r.ci).textContent = moving && r.tr.rate ? Math.round(r.tr.rate) : '–';
    document.getElementById('nt' + r.ci).textContent = r.tr.seen && r.stale ? 'Signal lost' : '';
    document.getElementById('st' + r.ci).classList.toggle('stale', !!(r.tr.seen && r.stale));
  });

  const gapEl = document.getElementById('gap'), sub = document.getElementById('gapsub');
  const have = rows.filter(r => r.d != null);
  if (have.length === 2){
    const [a, b] = have;
    if (a.tr.fin != null && b.tr.fin != null){
      const w = a.tr.fin <= b.tr.fin ? a : b, l = w === a ? b : a;
      gapEl.textContent = w.cr.short + ' win';
      sub.textContent = 'by ' + ((l.tr.fin - w.tr.fin) / 1000).toFixed(1) + ' seconds';
    } else if (a.tr.fin != null || b.tr.fin != null){
      const w = a.tr.fin != null ? a : b, l = w === a ? b : a;
      gapEl.textContent = w.cr.short + ' have finished';
      sub.textContent = l.cr.short + ' ' + fmtM(Math.max(0, c.len - l.d)) + ' m to go';
    } else {
      const lead = a.d >= b.d ? a : b, trail = lead === a ? b : a, gm = lead.d - trail.d;
      if (gm < 1.5 || lead.d < 5){ gapEl.textContent = 'Level'; sub.textContent = lead.d < 5 ? 'On the start' : 'Bow ball to bow ball'; }
      else {
        gapEl.textContent = lead.cr.short + ' lead by ' + fmtM(gm) + ' m';
        const secs = trail.tr.V > 0.5 ? (gm / trail.tr.V).toFixed(1) + ' seconds, ' : '';
        sub.textContent = secs + lengthsTxt(gm, race.boatLen);
      }
    }
  } else { gapEl.textContent = have.length ? 'Waiting for both crews' : 'Waiting for crews'; sub.textContent = ''; }

  drawClose(race, rows);
  if (S.map) rows.forEach((r, i) => {
    const m = S.marks[i]; if (!m) return;
    if (r.d == null) { m.setStyle({ opacity: 0, fillOpacity: 0 }); return; }
    m.setLatLng(pointAt(c, Math.max(-50, Math.min(r.d, c.len + 50)), r.tr.off));
    m.setStyle({ opacity: 1, fillOpacity: r.stale ? .4 : 1 });
  });
}

/* ── start ── */
document.getElementById('title').textContent = EVENT_TITLE;
[['icoL', ICON_LEFT], ['icoR', ICON_RIGHT], ['brlogo', BOATRUN_LOGO]].forEach(([id, src]) => { const im = document.getElementById(id); im.onerror = () => { im.style.visibility = 'hidden'; }; if (src) im.src = src; else im.style.visibility = 'hidden'; });
document.getElementById('sub').textContent = DEMO ? 'Demo, simulated crews' : EVENT_SUB;
['left', 'right'].forEach(sd => {
  document.getElementById(sd === 'left' ? 'racesL' : 'racesR').innerHTML = RACES.map((r, i) => (r.side || 'left') === sd
    ? `<button data-i="${i}" aria-selected="false"><b>${esc(r.name)}</b><span class="rs" id="rs${i}"></span></button>` : '').join('');
});
document.querySelectorAll('.races button').forEach(b => b.onclick = () => selectRace(+b.dataset.i));
initMap();
selectRace(0);
pickStartRace();
setInterval(poll, 2000);
setInterval(render, 200);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
